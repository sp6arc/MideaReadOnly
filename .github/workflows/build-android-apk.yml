name: MideaRemonte — oryginalny Python midea-lan

on:
  push:
    branches: [midearemonte-python-upstream]
    paths:
      - 'app/**'
      - 'README.md'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'scripts/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'build.gradle.kts'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midearemonte-2-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.12 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact upstream code without modifications
        run: |
          bash ./scripts/fetch-upstream.sh
          python3.12 -m compileall -q app/src/main/python
          sha256sum app/src/main/python/midealan/device.py
      - name: Android 35
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Tests and APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: APK integrity / signature
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload complete APK
        uses: actions/upload-artifact@v4
        with:
          name: MideaRemonte-2.3.0-DIAGNOSTICS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  publish-direct-download:
    if: github.event_name == 'push' && github.ref == 'refs/heads/midearemonte-python-upstream'
    needs: build-debug-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK built and verified by read-only job
        uses: actions/download-artifact@v4
        with:
          name: MideaRemonte-2.3.0-DIAGNOSTICS-APK
          path: release
      - name: Prepare APK and ZIP
        run: |
          set -euo pipefail
          test -s release/app-debug.apk
          mv release/app-debug.apk release/MideaRemonte-2.3.0.apk
          (cd release && zip -9 MideaRemonte-2.3.0-APK.zip MideaRemonte-2.3.0.apk)
          sha256sum release/MideaRemonte-2.3.0.apk
      - name: Publish public download links on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/midearemonte-python-upstream" --jq '.object.sha')"
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "Newer commit exists; do not publish this obsolete APK."
            exit 0
          fi
          tag="v2.3.0-midearemonte"
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" \
              --target midearemonte-python-upstream \
              --title "MideaRemonte 2.3.0 – working-only C3 monitor + original Lua export" \
              --notes "APK for Android with the original, unchanged wuwentao/midea-lan (2026.10.0) engine. Read-only interface. Only the verified X01/X05/X07 LAN polls and passive 04-04 energy messages, plus original cloud Lua file export via Android Save As and time-stamped history. X09/X10 and all experimental probes removed. The original upstream Python remains unmodified. Debug-signed prerelease; actual device compatibility not guaranteed." \
              --prerelease
          fi
          gh release upload "$tag" \
            release/MideaRemonte-2.3.0.apk \
            release/MideaRemonte-2.3.0-APK.zip \
            -R "$GITHUB_REPOSITORY" --clobber
